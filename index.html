<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kosten-Checker</title>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #f5f7fb;
  margin: 0;
  padding: 0;
}

.container {
  max-width: 480px;
  margin: 80px auto;
  background: #ffffff;
  padding: 35px;
  border-radius: 16px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.08);
  text-align: center;
}

h1 {
  font-size: 26px;
  margin-bottom: 8px;
}

p {
  color: #6b7280;
  margin-bottom: 25px;
}

label {
  display: block;
  text-align: left;
  font-size: 14px;
  margin-top: 10px;
  margin-bottom: 5px;
  color: #374151;
}

input {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #e5e7eb;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 20px;
  background: #22c55e;
  border: none;
  color: white;
  font-size: 16px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 600;
}

button:hover {
  background: #16a34a;
}

.result {
  margin-top: 25px;
  font-size: 18px;
  color: #111827;
}

.savings {
  color: #16a34a;
  font-size: 24px;
  font-weight: bold;
  margin-top: 10px;
}

.trust {
  font-size: 13px;
  color: #9ca3af;
  margin-top: 15px;
}
</style>
</head>

<body>

<div class="container">
  <h1>Prüfe, ob du jeden Monat zu viel zahlst</h1>
  <p>Die meisten verschwenden 20€–100€ ohne es zu merken.</p>

  <label>Handyvertrag (€)</label>
  <input type="number" id="mobile">

  <label>Abonnements (€)</label>
  <input type="number" id="subs">

  <label>Fitnessstudio (€)</label>
  <input type="number" id="gym">

  <label>Sonstige Kosten (€)</label>
  <input type="number" id="other">

  <button onclick="calculate()">Kosten prüfen</button>

  <div class="result" id="result"></div>
  <div class="savings" id="savings"></div>

  <div class="trust">
    Keine Anmeldung • Keine Datenspeicherung • Sofortiges Ergebnis
  </div>
</div>

<script>
function calculate() {
  let mobile = parseFloat(document.getElementById('mobile').value) || 0;
  let subs = parseFloat(document.getElementById('subs').value) || 0;
  let gym = parseFloat(document.getElementById('gym').value) || 0;
  let other = parseFloat(document.getElementById('other').value) || 0;

  let total = mobile + subs + gym + other;

  let ideal = total * 0.7;
  let wasted = total - ideal;

  document.getElementById('result').innerHTML =
    "Du zahlst aktuell €" + total.toFixed(2) + " pro Monat";

  document.getElementById('savings').innerHTML =
    "⚠️ Du könntest €" + wasted.toFixed(2) + " sparen";
}
</script>

</body>
</html>
