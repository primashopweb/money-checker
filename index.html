.btn-gold{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:16px 32px;font-family:var(--font-h);font-weight:700;font-size:.95rem;color:#070b12;background:linear-gradient(135deg,var(--gold),var(--gold2));border:none;border-radius:50px;cursor:pointer;text-decoration:none;box-shadow:0 0 30px rgba(255,209,102,.22),0 4px 20px rgba(0,0,0,.4);transition:transform .2s,box-shadow .2s,filter .2s}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 0 50px rgba(255,209,102,.32);filter:brightness(1.05)}
.btn-outline-green{display:inline-flex;align-items:center;gap:7px;padding:11px 22px;font-family:var(--font-h);font-weight:700;font-size:.82rem;color:var(--green);background:transparent;border:1px solid rgba(0,229,160,.35);border-radius:30px;text-decoration:none;transition:all .2s}
.btn-outline-green:hover{background:rgba(0,229,160,.07)}

/* =============================================
   SECTION 1 — GELDCHECK CALCULATOR
   ============================================= */
.hero-1{padding:40px 0 50px;text-align:center}
.hero-eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--green);background:rgba(0,229,160,.08);border:1px solid rgba(0,229,160,.22);padding:5px 14px;border-radius:30px;margin-bottom:20px}
.hero-eyebrow::before{content:'●';font-size:.45rem;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.hero-1 h1{font-family:var(--font-h);font-size:clamp(2rem,6vw,3.2rem);font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-bottom:18px}
.hero-1 h1 span{background:linear-gradient(135deg,var(--red),#ff8c42);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero-1-sub{font-size:1.02rem;color:var(--muted);max-width:500px;margin:0 auto 32px;line-height:1.7}
.trust-pills{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}
.t-pill{display:flex;align-items:center;gap:5px;font-size:.75rem;color:rgba(255,255,255,.55);background:rgba(255,255,255,.03);border:1px solid var(--border);padding:5px 12px;border-radius:20px}
.t-pill .dot{color:var(--green)}

/* STATS */
.stats-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:50px}
.stat-c{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px 14px;text-align:center;backdrop-filter:blur(10px)}
.stat-n{font-family:var(--font-h);font-size:1.55rem;font-weight:800;background:linear-gradient(135deg,var(--green),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat-l{font-size:.7rem;color:var(--muted);margin-top:3px}

/* CALCULATOR */
.calc-card{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:var(--r);padding:30px 26px;backdrop-filter:blur(20px);position:relative;overflow:hidden;margin-bottom:20px}
.calc-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--green),var(--blue))}
.calc-title{font-family:var(--font-h);font-size:1.05rem;font-weight:700;margin-bottom:6px}
.calc-sub{font-size:.8rem;color:var(--muted);margin-bottom:24px}
.inp-group{margin-bottom:16px}
.inp-label{display:flex;align-items:center;justify-content:space-between;font-size:.78rem;font-weight:600;color:var(--muted);margin-bottom:7px;letter-spacing:.03em;text-transform:uppercase}
.inp-hint{font-size:.7rem;color:rgba(255,255,255,.22);font-weight:400;text-transform:none;letter-spacing:0}
.inp-wrap{position:relative}
.inp-wrap .eur{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--green);font-weight:700;font-family:var(--font-h);pointer-events:none}
.inp-wrap input{width:100%;padding:13px 14px 13px 34px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:var(--r-sm);color:var(--text);font-size:.95rem;font-family:var(--font-b);font-weight:500;outline:none;transition:border-color .2s,background .2s,box-shadow .2s;-webkit-appearance:none}
.inp-wrap input:focus{border-color:rgba(0,229,160,.5);background:rgba(0,229,160,.05);box-shadow:0 0 0 3px rgba(0,229,160,.08)}
.inp-wrap input::placeholder{color:rgba(255,255,255,.18)}
.inp-divider{height:1px;background:var(--border);margin:20px 0}
.btn-calc{width:100%;padding:15px;font-family:var(--font-h);font-weight:700;font-size:.95rem;color:#070b12;background:linear-gradient(135deg,var(--green),var(--blue));border:none;border-radius:var(--r-sm);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;transition:transform .2s,box-shadow .2s,filter .2s;box-shadow:0 4px 20px rgba(0,229,160,.18)}
.btn-calc:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,229,160,.28);filter:brightness(1.05)}

/* PROGRESS */
.prog-wrap{display:none;margin-top:18px}
.prog-wrap.show{display:block}
.prog-track{height:6px;background:rgba(255,255,255,.07);border-radius:10px;overflow:hidden;margin-bottom:9px}
.prog-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--green),var(--blue));border-radius:10px;transition:width 1.2s cubic-bezier(.4,0,.2,1)}
.prog-label{font-size:.75rem;color:var(--green);font-weight:600;display:flex;align-items:center;gap:5px}

/* RESULT */
.result-sec{display:none;margin-bottom:50px}
.result-sec.show{display:block}
.result-big{background:rgba(255,69,96,.07);border:1px solid rgba(255,69,96,.2);border-radius:var(--r);padding:28px 22px;text-align:center;position:relative;overflow:hidden;margin-bottom:14px}
.result-big::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--red),#ff8c42)}
.result-lbl{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--red);margin-bottom:8px;display:flex;align-items:center;justify-content:center;gap:5px}
.result-num{font-family:var(--font-h);font-size:clamp(2.8rem,10vw,4.5rem);font-weight:800;color:var(--red);letter-spacing:-.04em;line-height:1;margin-bottom:6px}
.result-sub-txt{color:rgba(255,255,255,.4);font-size:.82rem}
.result-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.res-mini{background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);padding:14px;text-align:center}
.res-mini.g{border-color:rgba(0,229,160,.22);background:rgba(0,229,160,.05)}
.res-mini-num{font-family:var(--font-h);font-size:1.45rem;font-weight:800;margin-bottom:3px}
.res-mini.g .res-mini-num{color:var(--green)}
.res-mini:not(.g) .res-mini-num{color:var(--gold)}
.res-mini-lbl{font-size:.7rem;color:var(--muted)}
.alert-strip{display:flex;align-items:flex-start;gap:10px;background:rgba(255,209,102,.07);border:1px solid rgba(255,209,102,.18);border-radius:var(--r-sm);padding:13px 15px;margin-bottom:10px}
.alert-strip p{font-size:.8rem;color:rgba(255,255,255,.7);line-height:1.55}
.alert-strip p strong{color:var(--gold)}
.trust-line{display:flex;align-items:center;gap:9px;background:rgba(0,229,160,.05);border:1px solid rgba(0,229,160,.14);border-radius:var(--r-sm);padding:11px 14px}
.trust-line p{font-size:.8rem;color:rgba(255,255,255,.6)}

/* OFFERS */
.offers-sec{display:none;margin-bottom:60px}
.offers-sec.show{display:block}
.offer-rec-badge{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green);background:rgba(0,229,160,.09);border:1px solid rgba(0,229,160,.22);padding:4px 12px;border-radius:20px;margin-bottom:10px}
.offer-card{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:var(--r);padding:24px 20px;margin-bottom:14px;position:relative;overflow:hidden;transition:transform .22s,box-shadow .22s}
.offer-card:hover{transform:translateY(-3px);box-shadow:0 20px 50px rgba(0,0,0,.3)}
.offer-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--green),var(--blue));opacity:.7}
.offer-tag{display:inline-flex;align-items:center;gap:5px;font-size:.67rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--green);background:rgba(0,229,160,.08);border:1px solid rgba(0,229,160,.18);padding:3px 10px;border-radius:20px;margin-bottom:12px}
.offer-title{font-family:var(--font-h);font-size:1.1rem;font-weight:700;margin-bottom:8px;line-height:1.2}
.offer-desc{color:var(--muted);font-size:.84rem;margin-bottom:14px;line-height:1.6}
.offer-saving{display:flex;align-items:center;gap:7px;background:rgba(0,229,160,.06);border:1px solid rgba(0,229,160,.14);border-radius:var(--r-sm);padding:9px 13px;margin-bottom:12px}
.offer-saving p{font-size:.8rem;color:var(--text)}
.offer-urgency{font-size:.73rem;color:var(--gold);font-weight:600;margin-bottom:16px}
.btn-offer{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:14px;font-family:var(--font-h);font-weight:700;font-size:.88rem;color:#070b12;background:linear-gradient(135deg,var(--green),var(--blue));border:none;border-radius:var(--r-sm);cursor:pointer;text-decoration:none;transition:transform .18s,box-shadow .18s;box-shadow:0 3px 15px rgba(0,229,160,.15)}
.btn-offer:hover{transform:translateY(-2px);box-shadow:0 6px 25px rgba(0,229,160,.25)}

/* HOW IT WORKS */
.steps{display:flex;flex-direction:column}
.step{display:flex;gap:16px;padding:18px 0;border-bottom:1px solid var(--border);align-items:flex-start}
.step:last-child{border-bottom:none}
.step-n{flex-shrink:0;width:36px;height:36px;border-radius:50%;background:rgba(0,229,160,.09);border:1px solid rgba(0,229,160,.28);display:flex;align-items:center;justify-content:center;font-family:var(--font-h);font-weight:800;font-size:.82rem;color:var(--green);margin-top:2px}
.step h4{font-family:var(--font-h);font-size:.92rem;font-weight:700;margin-bottom:4px}
.step p{font-size:.8rem;color:var(--muted);line-height:1.5}

/* =============================================
   SECTION 2 — LUMADOCK VPS
   ============================================= */
.vps-hero{padding:40px 0 40px;text-align:center}
.vps-pills{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:20px 0 28px}
.v-pill{display:flex;align-items:center;gap:5px;font-size:.75rem;color:rgba(255,255,255,.6);background:rgba(255,255,255,.03);border:1px solid var(--border);padding:5px 12px;border-radius:20px}
.stats-4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:50px}
@media(max-width:560px){.stats-4{grid-template-columns:repeat(2,1fr)}}

/* PROD TABS */
.tabs-scroll{overflow-x:auto;padding-bottom:4px;margin-bottom:28px;scrollbar-width:none}
.tabs-scroll::-webkit-scrollbar{display:none}
.tab-row{display:flex;gap:7px;min-width:max-content}
.tab-btn{padding:8px 18px;font-family:var(--font-h);font-weight:700;font-size:.77rem;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:30px;color:var(--muted);cursor:pointer;transition:all .2s;white-space:nowrap}
.tab-btn:hover{color:var(--text);border-color:rgba(255,255,255,.18)}
.tab-btn.active{background:linear-gradient(135deg,rgba(0,229,160,.14),rgba(0,184,255,.14));border-color:rgba(0,229,160,.4);color:var(--green)}
.tab-panel{display:none}
.tab-panel.active{display:block}
.tab-desc{color:var(--muted);font-size:.8rem;margin-bottom:18px;padding:10px 14px;background:rgba(255,255,255,.02);border-left:2px solid var(--green);border-radius:0 var(--r-sm) var(--r-sm) 0}

/* PRODUCT GRID */
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:14px}
.prod-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px 18px;position:relative;overflow:hidden;transition:transform .22s,box-shadow .22s;display:flex;flex-direction:column}
.prod-card:hover{transform:translateY(-4px);box-shadow:0 18px 45px rgba(0,0,0,.3)}
.prod-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--green),var(--blue));opacity:.5}
.prod-card.feat{border-color:rgba(0,229,160,.32);background:rgba(0,229,160,.035)}
.prod-card.feat::before{opacity:1}
.prod-card.gpu::before{background:linear-gradient(90deg,var(--purple),#ff6bbd);opacity:.7}
.feat-tag{position:absolute;top:12px;right:12px;font-size:.6rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:linear-gradient(135deg,var(--green),var(--blue));color:#070b12;padding:3px 8px;border-radius:12px}
.prod-cat{font-size:.65rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.prod-name{font-family:var(--font-h);font-size:1rem;font-weight:700;margin-bottom:12px;line-height:1.2}
.prod-specs{list-style:none;margin-bottom:16px;display:flex;flex-direction:column;gap:6px}
.prod-specs li{font-size:.78rem;color:rgba(255,255,255,.6);display:flex;align-items:center;gap:7px}
.prod-specs li::before{content:'✓';color:var(--green);font-size:.72rem;font-weight:700;flex-shrink:0}
.prod-specs li strong{color:var(--text)}
.prod-price{margin-top:auto;padding-top:14px;border-top:1px solid var(--border);display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:12px}
.price-m{font-family:var(--font-h);font-size:1.5rem;font-weight:800;color:var(--green);line-height:1}
.prod-card.gpu .price-m{color:var(--purple)}
.price-p{font-size:.68rem;color:var(--muted)}
.price-save{font-size:.62rem;font-weight:700;background:rgba(255,209,102,.1);border:1px solid rgba(255,209,102,.22);color:var(--gold);padding:2px 7px;border-radius:10px}
.btn-vps{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:11px;font-family:var(--font-h);font-weight:700;font-size:.82rem;color:#070b12;background:linear-gradient(135deg,var(--green),var(--blue));border-radius:var(--r-sm);text-decoration:none;transition:transform .18s,box-shadow .18s;box-shadow:0 3px 12px rgba(0,229,160,.12)}
.btn-vps:hover{transform:translateY(-2px);box-shadow:0 6px 22px rgba(0,229,160,.22)}
.prod-card.gpu .btn-vps{background:linear-gradient(135deg,var(--purple),#ff6bbd)}

/* LOCATIONS */
.loc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.loc-c{background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);padding:14px 10px;text-align:center}
.loc-f{font-size:1.4rem;margin-bottom:5px}
.loc-n{font-size:.72rem;font-weight:700;font-family:var(--font-h);margin-bottom:2px}
.loc-city{font-size:.67rem;color:var(--muted)}

/* WHY GRID */
.why-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.why-c{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px 16px}
.why-ic{font-size:1.5rem;margin-bottom:9px}
.why-t{font-family:var(--font-h);font-size:.9rem;font-weight:700;margin-bottom:5px}
.why-p{font-size:.78rem;color:var(--muted);line-height:1.55}

/* COMPARE TABLE */
.tbl-wrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;min-width:480px}
thead th{background:rgba(0,229,160,.06);border-bottom:1px solid var(--border);padding:13px 15px;font-family:var(--font-h);font-size:.75rem;font-weight:700;text-align:left;color:var(--green);letter-spacing:.04em;text-transform:uppercase}
thead th:first-child{color:var(--muted)}
tbody tr{border-bottom:1px solid rgba(255,255,255,.04);transition:background .15s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:rgba(255,255,255,.02)}
tbody td{padding:11px 15px;font-size:.8rem;color:rgba(255,255,255,.65)}
tbody td:first-child{font-weight:600;color:var(--text)}
.ck{color:var(--green);font-weight:700}
.cx{color:var(--muted)}
.hi-row td{background:rgba(0,229,160,.04)}

/* =============================================
   SECTION 3 — PROJECT PROFIT X
   ============================================= */
.ppx-hero{padding:40px 0 44px;text-align:center}
.ppx-hero h1{font-family:var(--font-h);font-size:clamp(1.9rem,5vw,3rem);font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-bottom:16px}
.ppx-hero h1 .gd{background:linear-gradient(135deg,var(--gold),var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.ppx-hero h1 .gr{background:linear-gradient(135deg,var(--green),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.ppx-hero p{font-size:1rem;color:var(--muted);max-width:540px;margin:0 auto 26px;line-height:1.7}
.price-box{background:rgba(255,209,102,.06);border:1px solid rgba(255,209,102,.22);border-radius:var(--r);padding:22px 20px;max-width:420px;margin:0 auto 24px;text-align:center}
.price-big{font-family:var(--font-h);font-size:2.8rem;font-weight:800;color:var(--gold);line-height:1;margin-bottom:5px}
.price-once{font-size:.78rem;color:var(--muted);margin-bottom:14px}
.price-chips{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
.chip{font-size:.67rem;font-weight:700;padding:3px 10px;border-radius:20px}
.chip.g{background:rgba(0,229,160,.09);border:1px solid rgba(0,229,160,.22);color:var(--green)}
.chip.gd{background:rgba(255,209,102,.09);border:1px solid rgba(255,209,102,.22);color:var(--gold)}
.chip.b{background:rgba(0,184,255,.09);border:1px solid rgba(0,184,255,.22);color:var(--blue)}
.ppx-proof{background:rgba(0,229,160,.05);border:1px solid rgba(0,229,160,.16);border-radius:var(--r);padding:16px 20px;display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap;margin:24px 0}
.ppx-pn{font-family:var(--font-h);font-size:1.4rem;font-weight:800;color:var(--green)}
.ppx-pl{font-size:.75rem;color:var(--muted)}
.ppx-pdiv{width:1px;height:28px;background:var(--border)}

/* MODULES */
.mod-list{display:flex;flex-direction:column}
.mod-item{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--border);align-items:flex-start}
.mod-item:last-child{border-bottom:none}
.mod-n{flex-shrink:0;width:36px;height:36px;border-radius:50%;background:rgba(255,209,102,.09);border:1px solid rgba(255,209,102,.28);display:flex;align-items:center;justify-content:center;font-family:var(--font-h);font-weight:800;font-size:.8rem;color:var(--gold);margin-top:2px}
.mod-tag{display:inline-block;font-size:.6rem;font-weight:700;padding:2px 8px;background:rgba(0,229,160,.07);border:1px solid rgba(0,229,160,.18);color:var(--green);border-radius:8px;margin-bottom:5px}
.mod-item h4{font-family:var(--font-h);font-size:.88rem;font-weight:700;margin-bottom:3px}
.mod-item p{font-size:.78rem;color:var(--muted);line-height:1.5}

/* FOR WHOM */
.for-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.for-c{background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);padding:14px;display:flex;gap:10px;align-items:flex-start}
.for-ic{font-size:1rem;flex-shrink:0;margin-top:1px}
.for-c strong{font-family:var(--font-h);font-size:.8rem;display:block;margin-bottom:2px}
.for-c p{font-size:.75rem;color:var(--muted);line-height:1.45}

/* TESTIMONIALS */
.testi-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.testi-c{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px 16px}
.testi-stars{color:var(--gold);font-size:.85rem;margin-bottom:8px}
.testi-txt{font-size:.8rem;color:rgba(255,255,255,.6);line-height:1.6;font-style:italic;margin-bottom:10px}
.testi-auth{font-size:.72rem;font-weight:600;color:var(--muted)}
.testi-badge-t{font-size:.6rem;color:var(--green);display:block;margin-top:2px}

/* CTA BOX */
.cta-box{background:linear-gradient(135deg,rgba(255,209,102,.08),rgba(255,170,51,.05));border:1px solid rgba(255,209,102,.22);border-radius:var(--r);padding:38px 24px;text-align:center;margin-bottom:16px}
.cta-box h2{font-family:var(--font-h);font-size:clamp(1.3rem,3vw,1.9rem);font-weight:800;letter-spacing:-.02em;margin-bottom:8px}
.cta-box p{color:var(--muted);font-size:.85rem;margin-bottom:20px}
.disclaimer-txt{font-size:.7rem;color:rgba(255,255,255,.22);line-height:1.65;background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:var(--r-sm);padding:14px;margin-bottom:16px}

/* SHARED FAQ */
.faq-list{display:flex;flex-direction:column}
.faq-item{border-bottom:1px solid var(--border)}
.faq-q{display:flex;align-items:center;justify-content:space-between;padding:16px 0;cursor:pointer;gap:14px}
.faq-qt{font-family:var(--font-h);font-weight:700;font-size:.87rem;line-height:1.3}
.faq-ic{color:var(--green);font-size:1.1rem;flex-shrink:0;transition:transform .25s}
.faq-item.open .faq-ic{transform:rotate(45deg)}
.faq-a{font-size:.8rem;color:var(--muted);line-height:1.7;padding-bottom:16px;display:none}
.faq-item.open .faq-a{display:block}

/* FOOTER */
footer{border-top:1px solid var(--border);padding:30px 20px;text-align:center}
.foot-logo{font-family:var(--font-h);font-weight:800;font-size:1rem;background:linear-gradient(90deg,var(--green),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:12px}
.foot-links{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.foot-links a{color:var(--muted);font-size:.73rem;text-decoration:none}
.foot-links a:hover{color:var(--text)}
.foot-imp{font-size:.7rem;color:rgba(255,255,255,.26);line-height:1.8;margin-bottom:10px}
.foot-disc{font-size:.67rem;color:rgba(255,255,255,.18);line-height:1.7;border-top:1px solid var(--border);padding-top:10px}

/* MODALS */
.modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);backdrop-filter:blur(6px);z-index:999;padding:20px;overflow-y:auto;align-items:flex-start;justify-content:center}
.modal-ov.open{display:flex}
.modal{background:#0e1420;border:1px solid var(--border);border-radius:var(--r);padding:26px 22px;max-width:500px;width:100%;margin:auto;position:relative}
.modal h3{font-family:var(--font-h);font-weight:800;margin-bottom:14px}
.modal p,.modal address{font-size:.82rem;color:var(--muted);line-height:1.8;font-style:normal}
.modal-x{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.07);border:none;color:var(--text);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center}

/* =============================================
   SECTION 4 — SEO ANALYZER
   ============================================= */
.seo-hero{padding:36px 0 40px;text-align:center}
.seo-hero h1{font-family:var(--font-h);font-size:clamp(1.8rem,5vw,2.8rem);font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-bottom:14px}
.seo-hero h1 .hl{background:linear-gradient(135deg,var(--blue),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.seo-hero p{color:var(--muted);font-size:.95rem;max-width:540px;margin:0 auto 24px;line-height:1.65}
.seo-features{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:30px}
.seo-feat{display:flex;align-items:center;gap:5px;font-size:.73rem;color:rgba(255,255,255,.6);background:rgba(255,255,255,.03);border:1px solid var(--border);padding:4px 11px;border-radius:18px}
.seo-feat .ic{color:var(--blue)}

/* INPUT CARD */
.seo-input-card{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:var(--r);padding:28px 24px;backdrop-filter:blur(18px);position:relative;overflow:hidden;margin-bottom:20px}
.seo-input-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--blue),var(--purple))}
.seo-url-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
@media(max-width:540px){.seo-url-row{grid-template-columns:1fr}}
.seo-url-group label{display:block;font-size:.75rem;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-bottom:7px}
.seo-url-wrap{position:relative}
.seo-url-wrap .url-ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:.85rem;pointer-events:none}
.seo-url-wrap input{width:100%;padding:13px 13px 13px 36px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:var(--r-sm);color:var(--text);font-size:.88rem;font-family:var(--font-b);outline:none;transition:border-color .2s,background .2s,box-shadow .2s}
.seo-url-wrap input:focus{border-color:rgba(0,184,255,.5);background:rgba(0,184,255,.04);box-shadow:0 0 0 3px rgba(0,184,255,.08)}
.seo-url-wrap input::placeholder{color:rgba(255,255,255,.18)}
.seo-url-wrap input.mine{border-color:rgba(0,229,160,.3)}
.seo-url-wrap input.competitor{border-color:rgba(180,124,255,.3)}
.seo-options{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.seo-opt-label{font-size:.75rem;color:var(--muted);font-weight:600}
.seo-toggle-row{display:flex;gap:8px}
.seo-toggle{padding:6px 14px;font-size:.72rem;font-weight:700;border-radius:20px;cursor:pointer;transition:all .2s;border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--muted);font-family:var(--font-h)}
.seo-toggle.active{background:rgba(0,184,255,.12);border-color:rgba(0,184,255,.35);color:var(--blue)}
.btn-seo-analyze{width:100%;padding:15px;font-family:var(--font-h);font-weight:700;font-size:.95rem;color:#070b12;background:linear-gradient(135deg,var(--blue),var(--purple));border:none;border-radius:var(--r-sm);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;transition:transform .2s,box-shadow .2s;box-shadow:0 4px 20px rgba(0,184,255,.2)}
.btn-seo-analyze:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,184,255,.3)}
.btn-seo-analyze:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* SEO PROGRESS */
.seo-prog{display:none;margin-top:18px}
.seo-prog.show{display:block}
.seo-prog-track{height:6px;background:rgba(255,255,255,.07);border-radius:10px;overflow:hidden;margin-bottom:8px}
.seo-prog-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--blue),var(--purple));border-radius:10px;transition:width 1s cubic-bezier(.4,0,.2,1)}
.seo-prog-lbl{font-size:.73rem;color:var(--blue);font-weight:600}

/* SEO RESULTS */
.seo-results{display:none;margin-bottom:50px}
.seo-results.show{display:block}

/* WINNER BANNER */
.winner-banner{background:linear-gradient(135deg,rgba(0,229,160,.08),rgba(0,184,255,.08));border:1px solid rgba(0,229,160,.25);border-radius:var(--r);padding:18px 20px;text-align:center;margin-bottom:20px}
.winner-banner h3{font-family:var(--font-h);font-size:1rem;font-weight:700;margin-bottom:4px}
.winner-banner p{font-size:.8rem;color:var(--muted)}

/* COMPARISON GRID */
.seo-compare-wrap{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
@media(max-width:520px){.seo-compare-wrap{grid-template-columns:1fr}}
.seo-site-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px 18px;position:relative;overflow:hidden}
.seo-site-card.mine-card{border-color:rgba(0,229,160,.3)}
.seo-site-card.comp-card{border-color:rgba(180,124,255,.3)}
.seo-site-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.seo-site-card.mine-card::before{background:linear-gradient(90deg,var(--green),var(--blue))}
.seo-site-card.comp-card::before{background:linear-gradient(90deg,var(--purple),#ff6bbd)}
.seo-site-label{font-size:.65rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.seo-site-card.mine-card .seo-site-label{color:var(--green)}
.seo-site-card.comp-card .seo-site-label{color:var(--purple)}
.seo-site-url{font-size:.75rem;color:var(--muted);margin-bottom:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:italic}
.seo-score-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.seo-score-box{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:var(--r-sm);padding:12px 10px;text-align:center}
.seo-score-num{font-family:var(--font-h);font-size:1.55rem;font-weight:800;line-height:1;margin-bottom:3px}
.seo-score-num.excellent{color:#00e5a0}
.seo-score-num.good{color:#ffd166}
.seo-score-num.poor{color:#ff4560}
.seo-score-lbl{font-size:.62rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.seo-vitals{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.seo-vital-row{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;background:rgba(255,255,255,.02);border-radius:6px}
.seo-vital-name{font-size:.74rem;color:var(--muted)}
.seo-vital-val{font-size:.74rem;font-weight:700}
.seo-vital-val.g{color:var(--green)}
.seo-vital-val.y{color:var(--gold)}
.seo-vital-val.r{color:var(--red)}
.seo-winner-tag{display:inline-flex;align-items:center;gap:4px;font-size:.62rem;font-weight:700;background:rgba(0,229,160,.12);border:1px solid rgba(0,229,160,.25);color:var(--green);padding:3px 8px;border-radius:10px;margin-top:10px}

/* SCORE OVERVIEW TABLE */
.seo-overview-table{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:20px}
.seo-ov-head{background:rgba(0,184,255,.06);border-bottom:1px solid var(--border);display:grid;grid-template-columns:1fr 1fr 1fr 80px;padding:11px 16px;font-family:var(--font-h);font-size:.72rem;font-weight:700;color:var(--blue);letter-spacing:.04em;text-transform:uppercase}
.seo-ov-row{display:grid;grid-template-columns:1fr 1fr 1fr 80px;padding:11px 16px;border-bottom:1px solid rgba(255,255,255,.04);align-items:center;transition:background .15s}
.seo-ov-row:last-child{border-bottom:none}
.seo-ov-row:hover{background:rgba(255,255,255,.02)}
.seo-ov-metric{font-size:.8rem;color:var(--text);font-weight:600}
.seo-ov-val{font-size:.8rem;font-weight:700}
.seo-ov-winner{font-size:.68rem;font-weight:700}
.win-you{color:var(--green)}
.win-comp{color:var(--purple)}
.win-tie{color:var(--gold)}

/* AI RECOMMENDATIONS */
.ai-rec-box{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:20px}
.ai-rec-head{background:rgba(0,184,255,.06);border-bottom:1px solid var(--border);padding:14px 18px;display:flex;align-items:center;gap:10px}
.ai-rec-head h3{font-family:var(--font-h);font-size:.95rem;font-weight:700}
.ai-badge{font-size:.62rem;font-weight:700;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;padding:2px 8px;border-radius:10px}
.ai-rec-body{padding:18px}
.ai-rec-loading{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.82rem}
.ai-typing-dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--blue);margin:0 2px;animation:dot-bounce 1.2s infinite}
.ai-typing-dots span:nth-child(2){animation-delay:.2s}
.ai-typing-dots span:nth-child(3){animation-delay:.4s}
@keyframes dot-bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
.ai-rec-content{font-size:.83rem;color:rgba(255,255,255,.75);line-height:1.75}
.ai-rec-content h4{font-family:var(--font-h);font-size:.88rem;color:var(--blue);margin:14px 0 6px;display:flex;align-items:center;gap:6px}
.ai-rec-content h4:first-child{margin-top:0}
.ai-rec-content ul{padding-left:16px;margin:0}
.ai-rec-content li{margin-bottom:6px;color:rgba(255,255,255,.65)}
.ai-rec-content .priority-high{color:var(--red);font-weight:700}
.ai-rec-content .priority-med{color:var(--gold);font-weight:700}
.ai-rec-content .priority-low{color:var(--green);font-weight:700}

/* INDEXED PAGES */
.indexed-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.indexed-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);padding:16px;text-align:center}
.indexed-card h4{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;font-weight:700}
.indexed-num{font-family:var(--font-h);font-size:1.6rem;font-weight:800;color:var(--blue);margin-bottom:6px}
.indexed-link{display:inline-flex;align-items:center;gap:5px;font-size:.7rem;color:var(--blue);text-decoration:none;border:1px solid rgba(0,184,255,.25);padding:4px 10px;border-radius:12px;transition:background .18s}
.indexed-link:hover{background:rgba(0,184,255,.08)}

/* CTA AFTER ANALYSIS */
.seo-cta-strip{background:linear-gradient(135deg,rgba(0,184,255,.08),rgba(180,124,255,.08));border:1px solid rgba(0,184,255,.2);border-radius:var(--r);padding:24px 20px;text-align:center;margin-bottom:16px}
.seo-cta-strip h3{font-family:var(--font-h);font-size:1.1rem;font-weight:700;margin-bottom:8px}
.seo-cta-strip p{font-size:.82rem;color:var(--muted);margin-bottom:16px}
.btn-seo-cta{display:inline-flex;align-items:center;gap:7px;padding:12px 24px;font-family:var(--font-h);font-weight:700;font-size:.85rem;color:#070b12;background:linear-gradient(135deg,var(--blue),var(--purple));border-radius:30px;text-decoration:none;transition:transform .18s,box-shadow .18s;box-shadow:0 3px 15px rgba(0,184,255,.2)}
.btn-seo-cta:hover{transform:translateY(-2px);box-shadow:0 6px 25px rgba(0,184,255,.3)}

/* SEO FAQ */
.seo-how-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:40px}
.seo-how-c{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px 14px}
.seo-how-ic{font-size:1.4rem;margin-bottom:8px}
.seo-how-t{font-family:var(--font-h);font-size:.85rem;font-weight:700;margin-bottom:5px}
.seo-how-p{font-size:.75rem;color:var(--muted);line-height:1.5}

@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}

/* ═══════════════════════════════════
   HAMBURGER MENU
   ═══════════════════════════════════ */
.hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:8px;border:none;background:rgba(255,255,255,.06);border-radius:8px;margin-left:8px}
.hamburger span{display:block;width:20px;height:2px;background:var(--text);border-radius:2px;transition:all .3s ease}
.hamburger.open span:nth-child(1){transform:rotate(45deg) translate(5px,5px)}
.hamburger.open span:nth-child(2){opacity:0;transform:translateX(-10px)}
.hamburger.open span:nth-child(3){transform:rotate(-45deg) translate(5px,-5px)}
.mobile-menu{display:none;position:fixed;top:56px;left:0;right:0;z-index:190;background:rgba(7,11,18,.98);backdrop-filter:blur(22px);border-bottom:1px solid var(--border);padding:16px 20px;flex-direction:column;gap:8px}
.mobile-menu.open{display:flex}
.mobile-menu a{display:flex;align-items:center;gap:10px;padding:13px 16px;font-family:var(--font-h);font-weight:700;font-size:.9rem;color:var(--muted);text-decoration:none;border-radius:10px;transition:all .2s;border:1px solid transparent}
.mobile-menu a:hover,.mobile-menu a.active{color:var(--text);background:rgba(255,255,255,.06);border-color:var(--border)}
.mobile-menu a.active{color:var(--green);border-color:rgba(0,229,160,.2)}
.mobile-menu .mob-cta{background:linear-gradient(135deg,var(--green),var(--blue));color:#070b12;text-align:center;justify-content:center;border:none;margin-top:4px}

/* ═══════════════════════════════════
   FULL RESPONSIVE BREAKPOINTS
   ═══════════════════════════════════ */

/* ── Tablet (≤ 768px) ── */
@media(max-width:768px){
  /* nav: hide desktop links, show hamburger */
  .nav-links{display:none!important}
  .nav-cta-btn{display:none}
  .hamburger{display:flex}

  /* containers */
  .container,.container-wide{padding:0 16px}

  /* page tabs font */
  .ptab{padding:12px 14px;font-size:.72rem}

  /* VPS stats 2x2 */
  .stats-4{grid-template-columns:repeat(2,1fr);gap:8px}

  /* product grid */
  .prod-grid{grid-template-columns:1fr 1fr}

  /* location grid */
  .loc-grid{grid-template-columns:repeat(3,1fr)}

  /* why grid */
  .why-grid{grid-template-columns:1fr 1fr}

  /* seo how grid */
  .seo-how-grid{grid-template-columns:1fr 1fr}

  /* url row stays 1 on tablet too */
  .seo-url-row{grid-template-columns:1fr}

  /* overview table */
  .seo-ov-head,.seo-ov-row{grid-template-columns:1fr 1fr 1fr 60px;font-size:.7rem}

  /* hero padding */
  .hero-1{padding:28px 0 36px}
  .vps-hero{padding:28px 0 28px}
  .ppx-hero{padding:28px 0 32px}
  .seo-hero{padding:28px 0 32px}

  /* buttons */
  .btn-green,.btn-gold{padding:15px 24px;font-size:.9rem}
}

/* ── Mobile (≤ 520px) ── */
@media(max-width:520px){
  /* nav */
  .nav-logo{font-size:.9rem}

  /* containers */
  .container,.container-wide{padding:0 14px}

  /* page tabs */
  .ptab{padding:11px 12px;font-size:.68rem}

  /* all grids → 1 column */
  .prod-grid{grid-template-columns:1fr}
  .for-grid,.testi-grid{grid-template-columns:1fr}
  .stats-3{grid-template-columns:repeat(3,1fr)}
  .stats-4{grid-template-columns:repeat(2,1fr)}
  .why-grid{grid-template-columns:1fr 1fr}
  .loc-grid{grid-template-columns:repeat(2,1fr)}
  .seo-how-grid{grid-template-columns:1fr 1fr}
  .result-row{grid-template-columns:1fr 1fr}
  .indexed-row{grid-template-columns:1fr 1fr}

  /* SEO compare */
  .seo-compare-wrap{grid-template-columns:1fr}
  .seo-score-row{grid-template-columns:repeat(2,1fr)}
  .seo-ov-head,.seo-ov-row{grid-template-columns:1fr 1fr 1fr;font-size:.68rem}
  .seo-ov-head div:last-child,.seo-ov-row .seo-ov-winner{display:none}

  /* overview table compact */
  .seo-ov-head{display:none}

  /* ppx proof */
  .ppx-proof{gap:12px}
  .ppx-pdiv{display:none}

  /* hero text */
  .hero-1 h1{font-size:clamp(1.7rem,7.5vw,2.4rem)}
  .ppx-hero h1{font-size:clamp(1.6rem,7vw,2.2rem)}
  .seo-hero h1{font-size:clamp(1.6rem,7vw,2.2rem)}
  .sec-title{font-size:clamp(1.3rem,5.5vw,1.9rem)}

  /* hero sub */
  .hero-1-sub,.ppx-hero p,.seo-hero p{font-size:.9rem}

  /* price box */
  .price-big{font-size:2.2rem}

  /* buttons full-width on mobile */
  .btn-green,.btn-gold,.btn-seo-analyze,.btn-calc{width:100%;max-width:100%!important}
  .cta-box .btn-gold{width:100%}
  .seo-cta-strip .btn-seo-cta{width:100%;justify-content:center}

  /* calc card padding */
  .calc-card,.seo-input-card{padding:20px 16px}

  /* input labels wrapping */
  .inp-label{flex-direction:column;align-items:flex-start;gap:3px}
  .inp-hint{font-size:.68rem}

  /* stats */
  .stat-n{font-size:1.25rem}
  .stat-c{padding:14px 10px}

  /* vps pills */
  .vps-pills,.hero-1 .trust-pills,.seo-features{gap:6px}
  .v-pill,.t-pill,.seo-feat{font-size:.68rem;padding:4px 9px}

  /* offer cards */
  .offer-card{padding:18px 14px}
  .offer-title{font-size:.98rem}

  /* prod cards */
  .prod-card{padding:16px 14px}
  .price-m{font-size:1.3rem}

  /* tbl */
  table{font-size:.72rem}
  thead th,tbody td{padding:9px 10px}

  /* testimonials */
  .testi-c{padding:14px}
  .testi-txt{font-size:.75rem}

  /* module list */
  .mod-item{gap:10px;padding:14px 0}
  .mod-n{width:30px;height:30px;font-size:.72rem}

  /* ppx CTA */
  .cta-box{padding:26px 16px}

  /* AI rec box */
  .ai-rec-body{padding:14px}
  .ai-rec-content{font-size:.78rem}

  /* footer */
  .foot-links{gap:12px}
  .foot-links a{font-size:.7rem}

  /* tabs smaller still */
  .ptab{padding:10px 10px;font-size:.65rem;letter-spacing:0}

  /* touch targets min 44px */
  .btn-calc,.btn-gold,.btn-green,.btn-vps,.btn-offer,.btn-seo-analyze{min-height:44px}
  .ptab{min-height:44px}
  .mobile-menu a{min-height:48px}

  /* seo options on mobile */
  .seo-options{flex-direction:column;align-items:flex-start;gap:8px}
}

/* ── Small mobile (≤ 380px) ── */
@media(max-width:380px){
  .stats-3{grid-template-columns:1fr}
  .stats-4{grid-template-columns:1fr 1fr}
  .ptab{padding:9px 8px;font-size:.62rem}
  .loc-grid{grid-template-columns:repeat(2,1fr)}
  .price-chips{flex-direction:column;align-items:center}

async function runProductHunt() {
  if (selectedCats.size === 0) return;
  const cats = CATEGORIES.filter(c => selectedCats.has(c.id));
  const btn  = document.getElementById('phSearchBtn');
  btn.disabled = true;

  const prog = document.getElementById('phProg');
  const fill = document.getElementById('phProgFill');
  const lbl  = document.getElementById('phProgLbl');
  prog.classList.add('show'); fill.style.width = '0%';

  const messages = [
    [15, '🔍 Durchsuche Amazon.de Bestseller...'],
    [35, '🛒 AliExpress Deutschland wird analysiert...'],
    [55, '📊 Filtere: 5.000+ Verkäufe, 500+ Bewertungen...'],
    [70, '💶 Berechne Preis-Spannen & Margen...'],
    [85, '🤖 KI erstellt Produktempfehlungen...'],
    [100,'✅ Ergebnisse bereit!']
  ];
  let mi = 0;
  const prog_int = setInterval(() => {
    if (mi < messages.length - 1) {
      fill.style.width = messages[mi][0] + '%';
      lbl.textContent = messages[mi][1];
      mi++;
    }
  }, 700);

  // Show skeleton loading
  const resultsEl = document.getElementById('phResults');
  const body = document.getElementById('phResultsBody');
  resultsEl.classList.add('show','visible');
  body.innerHTML = cats.map(() => `
    <div class="ph-cat-section">
      <div class="ph-skeleton">
        ${[1,2,3,4].map(() => `<div class="ph-skel-card"><div class="ph-skel-img"></div><div class="ph-skel-line"></div><div class="ph-skel-line short"></div><div class="ph-skel-line med"></div></div>`).join('')}
      </div>
    </div>
  `).join('');

  try {
    const prompt = buildProductPrompt(cats, currentPlatform);
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 4000,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const data = await res.json();
    const txt = data.content?.find(b => b.type === 'text')?.text || '[]';

    // Parse JSON from response
    const jsonMatch = txt.match(/\[[\s\S]*\]/);
    if (!jsonMatch) throw new Error('No JSON found');
    allProductData = JSON.parse(jsonMatch[0]);

  } catch(e) {
    // Fallback: use built-in data
    allProductData = generateFallbackData(cats, currentPlatform);
  }

  clearInterval(prog_int);
  fill.style.width = '100%';
  lbl.textContent = '✅ ' + allProductData.reduce((s,c) => s + c.products.length, 0) + ' Produkte gefunden!';

  renderResults(allProductData);
  document.getElementById('phResultsTitle').textContent = '🔥 Top Bestseller – ' + cats.map(c=>c.name).join(', ');
  document.getElementById('phResultsMeta').textContent = allProductData.reduce((s,c) => s + c.products.length, 0) + ' Produkte · min. 5.000 Verkäufe · min. 500 Bewertungen · Stand: ' + new Date().toLocaleDateString('de-DE');
  setTimeout(() => resultsEl.scrollIntoView({behavior:'smooth', block:'start'}), 200);
  btn.disabled = false;
}

function renderResults(data) {
  const body = document.getElementById('phResultsBody');
  body.innerHTML = data.map(catData => `
    <div class="ph-cat-section">
      <div class="ph-cat-section-title">
        <span>${catData.emoji}</span>
        <span>${catData.category}</span>
        <span class="ph-cat-tag">Top ${catData.products.length}</span>
      </div>
      <div class="ph-prod-grid">
        ${catData.products.map(p => renderProductCard(p, catData)).join('')}
      </div>
    </div>
  `).join('');
}

function renderProductCard(p, catData) {
  const platBadge = p.platform === 'amazon' ? '<span class="ph-platform-badge amz">Amazon.de</span>'
    : p.platform === 'aliexpress' ? '<span class="ph-platform-badge ali">AliExpress</span>'
    : '<span class="ph-platform-badge both">Beide Plattformen</span>';
  const margin = Math.round(((p.amazon_price - p.ali_price) / p.amazon_price) * 100);
  const profit = (p.amazon_price - p.ali_price).toFixed(2);
  const amzLink = `https://www.amazon.de/s?k=${encodeURIComponent(p.name)}&tag=geldcheck-21`;
  const aliLink = `https://de.aliexpress.com/wholesale?SearchText=${encodeURIComponent(p.name)}`;

  const priceRow = p.platform === 'amazon'
    ? `<div class="ph-price-box amz-box" style="flex:1"><div class="ph-price-platform">Amazon.de</div><div class="ph-price-amount">€${p.amazon_price}</div><div class="ph-price-note">Verkaufspreis</div></div>`
    : p.platform === 'aliexpress'
    ? `<div class="ph-price-box ali-box" style="flex:1"><div class="ph-price-platform">AliExpress</div><div class="ph-price-amount">€${p.ali_price}</div><div class="ph-price-note">Einkaufspreis</div></div>`
    : `<div class="ph-price-box amz-box"><div class="ph-price-platform">Amazon.de</div><div class="ph-price-amount">€${p.amazon_price}</div><div class="ph-price-note">Verkaufspreis</div></div>
       <div class="ph-price-box ali-box"><div class="ph-price-platform">AliExpress</div><div class="ph-price-amount">€${p.ali_price}</div><div class="ph-price-note">Einkaufspreis</div></div>`;

  const ctaRow = p.platform === 'amazon'
    ? `<a href="${amzLink}" target="_blank" rel="noopener" class="ph-btn-amz" style="flex:1">🛒 Amazon.de</a>`
    : p.platform === 'aliexpress'
    ? `<a href="${aliLink}" target="_blank" rel="noopener" class="ph-btn-ali" style="flex:1">🛍️ AliExpress</a>`
    : `<a href="${amzLink}" target="_blank" rel="noopener" class="ph-btn-amz">🛒 Amazon</a>
       <a href="${aliLink}" target="_blank" rel="noopener" class="ph-btn-ali">🛍️ AliExpress</a>`;

  return `
    <div class="ph-prod-card" data-platform="${p.platform}">
      <div class="ph-rank">#${p.rank}</div>
      ${platBadge}
      <div class="ph-prod-img">${p.emoji}</div>
      <div class="ph-prod-body">
        <div class="ph-prod-name">${p.name}</div>
        <div class="ph-prod-stats">
          <span class="ph-stat-pill reviews">⭐ ${p.rating} (${p.reviews.toLocaleString('de-DE')})</span>
          <span class="ph-stat-pill sold">📦 ${p.sold_monthly.toLocaleString('de-DE')}/Monat</span>
          <span class="ph-stat-pill trend">${p.trend}</span>
        </div>
        <div class="ph-price-row">${priceRow}</div>
        ${p.platform === 'both' ? `<div class="ph-profit-badge"><span class="ph-profit-label">💰 Geschätzte Marge</span><span class="ph-profit-val">€${profit} (${margin}%)</span></div>` : ''}
        ${p.highlight ? `<div style="font-size:.7rem;color:var(--muted);margin-bottom:10px">✅ ${p.highlight}</div>` : ''}
        <div class="ph-cta-row">${ctaRow}</div>
      </div>
    </div>
  `;
}

let seoStrategy = 'mobile';
function setStrategy(s, btn) {
  seoStrategy = s;
  document.querySelectorAll('.seo-toggle').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function normalizeUrl(u) {
  u = u.trim();
  if (!u) return '';
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  return u;
}

function extractDomain(u) {
  try { return new URL(u).hostname.replace('www.',''); } catch { return u; }
}

function scoreColor(s) {
  if (s >= 90) return 'excellent';
  if (s >= 50) return 'good';
  return 'poor';
}

function vitalColor(metric, val) {
  const thresholds = {
    fcp:  [1800, 3000],
    lcp:  [2500, 4000],
    cls:  [0.1, 0.25],
    tbt:  [200, 600],
    si:   [3400, 5800]
  };
  const t = thresholds[metric];
  if (!t) return 'g';
  return val <= t[0] ? 'g' : val <= t[1] ? 'y' : 'r';
}

function fmtMs(ms) {
  if (ms === null || ms === undefined) return 'N/A';
  return ms < 1000 ? Math.round(ms) + ' ms' : (ms/1000).toFixed(1) + ' s';
}

function fmtCls(v) {
  if (v === null || v === undefined) return 'N/A';
  return parseFloat(v).toFixed(3);
}

async function fetchPageSpeed(url) {
  const api = `https://www.googleapis.com/pagespeedonline/v5/runPagespeed?url=${encodeURIComponent(url)}&strategy=${seoStrategy}&category=performance&category=seo&category=accessibility&category=best-practices`;
  const r = await fetch(api);
  if (!r.ok) throw new Error('PageSpeed API Fehler: ' + r.status);
  return r.json();
}

function parsePS(data) {
  const cats = data.lighthouseResult?.categories || {};
  const audits = data.lighthouseResult?.audits || {};
  return {
    performance: Math.round((cats.performance?.score || 0) * 100),
    seo:         Math.round((cats.seo?.score || 0) * 100),
    accessibility:Math.round((cats.accessibility?.score || 0) * 100),
    bestPractices:Math.round((cats['best-practices']?.score || 0) * 100),
    fcp:  audits['first-contentful-paint']?.numericValue || null,
    lcp:  audits['largest-contentful-paint']?.numericValue || null,
    cls:  audits['cumulative-layout-shift']?.numericValue || null,
    tbt:  audits['total-blocking-time']?.numericValue || null,
    si:   audits['speed-index']?.numericValue || null,
    opportunities: Object.values(audits).filter(a => a.score !== null && a.score < 0.9 && a.details?.type === 'opportunity').slice(0,5).map(a => a.title),
    passed: Object.values(audits).filter(a => a.score === 1).length,
    failed: Object.values(audits).filter(a => a.score !== null && a.score < 0.5).length,
  };
}

function renderSiteCard(prefix, url, data) {
  document.getElementById(prefix+'Url').textContent = extractDomain(url);
  const sc = n => { const el = document.getElementById(prefix+n); if(!el) return; };

  const scores = {Perf: data.performance, Seo: data.seo, Acc: data.accessibility, BP: data.bestPractices};
  Object.entries(scores).forEach(([k,v]) => {
    const el = document.getElementById(prefix+k);
    if (el) { el.textContent = v; el.className = 'seo-score-num ' + scoreColor(v); }
  });

  const vitals = {Fcp: ['fcp',fmtMs(data.fcp),'fcp',data.fcp], Lcp: ['lcp',fmtMs(data.lcp),'lcp',data.lcp], Cls: ['cls',fmtCls(data.cls),'cls',data.cls], Tbt: ['tbt',fmtMs(data.tbt),'tbt',data.tbt], Si: ['si',fmtMs(data.si),'si',data.si]};
  Object.entries(vitals).forEach(([k,[metric,display,threshKey,raw]]) => {
    const el = document.getElementById(prefix+k);
    if (el) { el.textContent = display; el.className = 'seo-vital-val ' + vitalColor(threshKey, raw); }
  });
}

function renderOverviewTable(mData, cData) {
  const rows = document.getElementById('seoOvRows');
  const metrics = [
    ['Performance', mData.performance, cData.performance, '%'],
    ['SEO Score',   mData.seo,         cData.seo,         '%'],
    ['Accessibility', mData.accessibility, cData.accessibility, '%'],
    ['Best Practices', mData.bestPractices, cData.bestPractices, '%'],
    ['FCP', mData.fcp ? mData.fcp/1000 : null, cData.fcp ? cData.fcp/1000 : null, 's', true],
    ['LCP', mData.lcp ? mData.lcp/1000 : null, cData.lcp ? cData.lcp/1000 : null, 's', true],
    ['TBT', mData.tbt, cData.tbt, 'ms', true],
  ];
  rows.innerHTML = metrics.map(([name, mv, cv, unit, lower]) => {
    let winner = '';
    let wc = '';
    if (mv !== null && cv !== null) {
      const mWins = lower ? mv < cv : mv > cv;
      const cWins = lower ? cv < mv : cv > mv;
      if (mv === cv) { winner = 'Unentschieden'; wc = 'win-tie'; }
      else if (mWins) { winner = '🟢 Du'; wc = 'win-you'; }
      else { winner = '🟣 Konkurrenz'; wc = 'win-comp'; }
    }
    const mvd = mv !== null ? (unit === 's' ? mv.toFixed(2) + unit : Math.round(mv) + unit) : '-';
    const cvd = cv !== null ? (unit === 's' ? cv.toFixed(2) + unit : Math.round(cv) + unit) : '-';
    return `<div class="seo-ov-row">
      <div class="seo-ov-metric">${name}</div>
      <div class="seo-ov-val ${scoreColor(typeof mv==='number'?mv:50)}">${mvd}</div>
      <div class="seo-ov-val ${scoreColor(typeof cv==='number'?cv:50)}">${cvd}</div>
      <div class="seo-ov-winner ${wc}">${winner}</div>
    </div>`;
  }).join('');
  document.getElementById('seoOverviewTable').style.display = 'block';
}

function renderWinner(mData, cData, mUrl, cUrl) {
  const mScore = mData.performance + mData.seo + mData.accessibility + mData.bestPractices;
  const cScore = cData.performance + cData.seo + cData.accessibility + cData.bestPractices;
  const banner = document.getElementById('winnerBanner');
  const text   = document.getElementById('winnerText');
  const sub    = document.getElementById('winnerSub');
  banner.style.display = 'block';
  if (mScore > cScore) {
    text.innerHTML = '🏆 Deine Website gewinnt!';
    sub.textContent = `${extractDomain(mUrl)} (${Math.round(mScore/4)} Ø-Score) schlägt ${extractDomain(cUrl)} (${Math.round(cScore/4)} Ø-Score)`;
    banner.style.borderColor = 'rgba(0,229,160,.4)';
  } else if (cScore > mScore) {
    text.innerHTML = '⚠️ Konkurrenz ist stärker';
    sub.textContent = `${extractDomain(cUrl)} (${Math.round(cScore/4)} Ø-Score) übertrifft deine Site (${Math.round(mScore/4)} Ø-Score). Schau dir die KI-Empfehlungen an!`;
    banner.style.borderColor = 'rgba(255,69,96,.4)';
  } else {
    text.innerHTML = '🤝 Gleichstand!';
    sub.textContent = 'Beide Websites haben ähnliche Scores. Die Details zeigen wo du vorne liegst.';
  }
}

async function getAiRecommendations(mData, cData, mUrl, cUrl) {
  const body = document.getElementById('aiRecBody');
  body.innerHTML = `<div class="ai-rec-loading"><div class="ai-typing-dots"><span></span><span></span><span></span></div><span>KI analysiert die Ergebnisse...</span></div>`;

  const prompt = `Du bist ein SEO-Experte. Analysiere diese Website-Daten und gib konkrete, priorisierte Verbesserungsempfehlungen auf Deutsch.

Meine Website (${extractDomain(mUrl)}):
- Performance: ${mData.performance}/100
- SEO: ${mData.seo}/100
- Accessibility: ${mData.accessibility}/100
- Best Practices: ${mData.bestPractices}/100
- FCP: ${fmtMs(mData.fcp)}, LCP: ${fmtMs(mData.lcp)}, CLS: ${fmtCls(mData.cls)}, TBT: ${fmtMs(mData.tbt)}
- Fehlerhafte Audits: ${mData.failed}, bestandene: ${mData.passed}
${mData.opportunities.length ? '- Gefundene Probleme: ' + mData.opportunities.join(', ') : ''}
${cData ? `
Konkurrenz (${extractDomain(cUrl)}):
- Performance: ${cData.performance}/100, SEO: ${cData.seo}/100
` : ''}

Antworte mit kurzen, konkreten HTML-Empfehlungen. Format:
<h4>🔴 Kritisch (sofort beheben)</h4><ul><li>...</li></ul>
<h4>🟡 Wichtig (diese Woche)</h4><ul><li>...</li></ul>
<h4>🟢 Optimierung (langfristig)</h4><ul><li>...</li></ul>
${cData ? '<h4>⚔️ Gegen Konkurrenz gewinnen</h4><ul><li>...</li></ul>' : ''}

Maximal 3-4 Punkte pro Abschnitt. Sehr konkret und umsetzbar.`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{role:'user', content: prompt}]
      })
    });
    const data = await res.json();
    const txt = data.content?.find(b => b.type === 'text')?.text || '';
    body.innerHTML = `<div class="ai-rec-content">${txt}</div>`;
  } catch(e) {
    // Fallback with rule-based recommendations
    let html = '';
    const criticals = [];
    const important = [];
    const optimize = [];

    if (mData.performance < 50) criticals.push('Performance ist kritisch niedrig (' + mData.performance + '/100) – Hosting oder Code optimieren');
    if (mData.lcp && mData.lcp > 4000) criticals.push('LCP zu hoch (' + fmtMs(mData.lcp) + ') – Bilder komprimieren, Lazy Loading aktivieren');
    if (mData.tbt && mData.tbt > 600) criticals.push('Total Blocking Time zu hoch (' + fmtMs(mData.tbt) + ') – JavaScript minimieren und defer verwenden');
    if (mData.seo < 70) criticals.push('SEO Score niedrig (' + mData.seo + '/100) – Meta-Tags, Titel und strukturierte Daten prüfen');

    if (mData.cls && mData.cls > 0.1) important.push('Layout Shift reduzieren (CLS: ' + fmtCls(mData.cls) + ') – Bildgrößen definieren, keine Schriften die springen');
    if (mData.accessibility < 80) important.push('Accessibility verbessern (' + mData.accessibility + '/100) – Alt-Texte für Bilder, Kontrast erhöhen');
    if (mData.fcp && mData.fcp > 3000) important.push('First Contentful Paint zu langsam – CSS kritisch inlinen, Schriften optimieren');
    if (mData.bestPractices < 80) important.push('Best Practices verbessern – HTTPS prüfen, veraltete APIs entfernen');

    optimize.push('Bilder in WebP/AVIF konvertieren für 30-50% kleinere Dateigrößen');
    optimize.push('Browser-Caching aktivieren für wiederkehrende Besucher');
    optimize.push('CDN einsetzen für schnellere Auslieferung weltweit');
    optimize.push('Gzip/Brotli-Komprimierung auf dem Server aktivieren');

    if (criticals.length) html += `<h4>🔴 Kritisch (sofort beheben)</h4><ul>${criticals.map(c => '<li>'+c+'</li>').join('')}</ul>`;
    if (important.length) html += `<h4>🟡 Wichtig (diese Woche)</h4><ul>${important.map(c => '<li>'+c+'</li>').join('')}</ul>`;
    html += `<h4>🟢 Optimierung (langfristig)</h4><ul>${optimize.map(c => '<li>'+c+'</li>').join('')}</ul>`;

    if (cData) {
      const gaps = [];
      if (cData.performance > mData.performance) gaps.push('Konkurrenz hat bessere Performance (' + cData.performance + ' vs ' + mData.performance + ') – Hosting und Ladezeit optimieren');
      if (cData.seo > mData.seo) gaps.push('Konkurrenz hat höheren SEO Score – strukturierte Daten und interne Verlinkung verbessern');
      if (gaps.length) html += `<h4>⚔️ Gegen Konkurrenz gewinnen</h4><ul>${gaps.map(g => '<li>'+g+'</li>').join('')}</ul>`;
    }

    body.innerHTML = `<div class="ai-rec-content">${html || '<p>Gute Ergebnisse! Keine kritischen Probleme gefunden.</p>'}</div>`;
  }
}

async function runSeoAnalysis() {
  const mineRaw = document.getElementById('urlMine').value;
  const compRaw = document.getElementById('urlComp').value;
  const mUrl = normalizeUrl(mineRaw);
  const cUrl  = normalizeUrl(compRaw);

  if (!mUrl) { document.getElementById('urlMine').focus(); return; }

  const btn = document.getElementById('seoAnalyzeBtn');
  btn.disabled = true;

  const prog = document.getElementById('seoProg');
  const fill = document.getElementById('seoProgFill');
  const lbl  = document.getElementById('seoProgLbl');
  prog.classList.add('show'); fill.style.width = '0%';

  const steps = [
    [10,'🔄 Verbindung zu Google PageSpeed...'],
    [30,'⚡ Analysiere deine Website...'],
    [55,'📊 Auswerte Performance-Daten...'],
    cUrl ? [70,'🔍 Analysiere Konkurrenz-Website...'] : null,
    [85,'🤖 KI bereitet Empfehlungen vor...'],
    [100,'✅ Analyse abgeschlossen!']
  ].filter(Boolean);

  let si = 0;
  const stepInterval = setInterval(() => {
    if (si < steps.length - 1) {
      fill.style.width = steps[si][0] + '%';
      lbl.textContent = steps[si][1];
      si++;
    }
  }, 600);

  try {
    const mineData = await fetchPageSpeed(mUrl);
    const mParsed  = parsePS(mineData);

    let cParsed = null;
    if (cUrl) {
      try {
        const compData = await fetchPageSpeed(cUrl);
        cParsed = parsePS(compData);
      } catch(e) { /* Competitor failed silently */ }
    }

    clearInterval(stepInterval);
    fill.style.width = '100%';
    lbl.textContent = '✅ Analyse abgeschlossen!';

    // Show results
    const resultsEl = document.getElementById('seoResults');
    resultsEl.classList.add('show','visible');

    renderSiteCard('mine', mUrl, mParsed);

    // Competitor card
    if (cParsed) {
      document.getElementById('compCard').style.display = 'block';
      renderSiteCard('comp', cUrl, cParsed);
      renderOverviewTable(mParsed, cParsed);
      renderWinner(mParsed, cParsed, mUrl, cUrl);
      document.getElementById('compIndexCard').style.display = 'block';
      document.getElementById('compIndexed').textContent = '→ Prüfen';
      document.getElementById('compIndexLink').href = 'https://www.google.com/search?q=site:' + extractDomain(cUrl);
    }

    // Google index links
    const domain = extractDomain(mUrl);
    document.getElementById('mineIndexed').textContent = '→ Prüfen';
    document.getElementById('mineIndexLink').href = 'https://www.google.com/search?q=site:' + domain;

    // AI Recommendations
    await getAiRecommendations(mParsed, cParsed, mUrl, cUrl);

    setTimeout(() => resultsEl.scrollIntoView({behavior:'smooth', block:'start'}), 200);

  } catch(e) {
    clearInterval(stepInterval);
    fill.style.width = '100%';
    lbl.innerHTML = '❌ Fehler: ' + (e.message.includes('fetch') ? 'URL nicht erreichbar oder ungültig.' : e.message);
    lbl.style.color = 'var(--red)';
  }

  btn.disabled = false;
}

function calculate() {
  const handy    = parseFloat(document.getElementById('handy').value)    || 0;
  const abos     = parseFloat(document.getElementById('abos').value)     || 0;
  const gym      = parseFloat(document.getElementById('gym').value)      || 0;
  const sonstige = parseFloat(document.getElementById('sonstige').value) || 0;
  if (handy + abos + gym + sonstige === 0) { shake(document.querySelector('.calc-card')); return; }

  const pw = document.getElementById('progWrap');
  const pf = document.getElementById('progFill');
  const pl = document.getElementById('progLabel');
  pw.classList.add('show'); pf.style.width = '0%';
  pl.innerHTML = '🔄 Kosten werden analysiert...';
  setTimeout(() => { pf.style.width = '45%'; pl.innerHTML = '📊 Vergleiche mit Durchschnittswerten...'; }, 100);
  setTimeout(() => { pf.style.width = '80%'; pl.innerHTML = '💡 Sparpotenzial wird berechnet...'; }, 700);
  setTimeout(() => {
    pf.style.width = '100%'; pl.innerHTML = '✅ Analyse abgeschlossen';
    const total = handy + abos + gym + sonstige;
    const yearly = total * 12;
    const saving = Math.round(total * 0.40);
    animateNum('yearlyLoss', yearly, '€');
    animateNum('monthlyTotal', total, '€');
    animateNum('savingPot', saving, '€');
    const rs = document.getElementById('resultSec');
    rs.classList.add('show','visible');
    setTimeout(() => rs.scrollIntoView({behavior:'smooth', block:'start'}), 200);
    buildOffers(handy, sonstige, yearly);
    setTimeout(() => {
      const os = document.getElementById('offersSec');
      os.classList.add('show','visible');
    }, 600);
  }, 1400);
}

function animateNum(id, target, prefix) {
  const el = document.getElementById(id);
  const dur = 900, start = performance.now();
  const tick = (now) => {
    const p = Math.min((now - start) / dur, 1);
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = prefix + Math.round(target * e).toLocaleString('de-DE');
    if (p < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
